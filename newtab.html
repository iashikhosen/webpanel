<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="welcome.css"><title>Add New Tab</title></head><body><main><div class="mark">+</div><p class="eyebrow">WEBPANEL</p><h1>Add a new tab</h1><p class="copy">Keep a website close while you work. You can edit its name, address, or pin state anytime.</p><form id="newTabForm"><label>Tab name<input id="tabName" maxlength="48" placeholder="e.g. Project dashboard" autofocus></label><label>Website address<input id="tabUrl" required placeholder="https://example.com"></label><label class="check-row"><input id="tabPinned" type="checkbox"> Keep this tab pinned</label><button>Add tab</button></form><p id="status" role="status"></p></main><script src="newtab.js"></script></body></html>
