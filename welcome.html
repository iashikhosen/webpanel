<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="welcome.css"><title>My Home · WebPanel</title></head><body><main><img class="brand-logo" src="icons/icon128.png" alt="WebPanel"><h1>Congratulations! Your workspace is ready.</h1><form id="newTabForm"><label>Tab name<input id="tabName" maxlength="48" placeholder="e.g. Project dashboard" autofocus></label><label>Website address<input id="tabUrl" required placeholder="https://example.com"></label><label class="check-row"><input id="tabPinned" type="checkbox"> Keep this tab pinned</label><button>Open this tab</button></form><section class="settings-card"><div><b>Customize WebPanel</b><span>Manage your Home page, display, startup, and device permissions.</span></div><button id="openSettings" type="button" class="settings-button">Open settings →</button></section><p id="status" role="status"></p></main><script src="welcome.js"></script></body></html>
